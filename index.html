<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Gen AI Studio - Mobile Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        .animate-progress { animation: progress 30s linear forwards; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0a0c10] text-slate-200 font-sans selection:bg-teal-500/30 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SparklesIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/></svg>;
        const SettingsIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const BookIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const VolumeIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>;
        const ImageIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>;
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="6 3 20 12 6 21 6 3"/></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>;

        const pcmToWav = (pcmData, sampleRate) => {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) { view.setUint8(offset + i, string.charCodeAt(i)); }
            };
            writeString(0, 'RIFF'); view.setUint32(4, 32 + pcmData.length * 2, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) { view.setInt16(44 + i * 2, pcmData[i], true); }
            return new Blob([buffer], { type: 'audio/wav' });
        };

        const App = () => {
            const [apiKey, setApiKey] = useState('');
            const [loading, setLoading] = useState(false);
            const [ttsLoading, setTtsLoading] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            const [topic, setTopic] = useState('');
            const [language, setLanguage] = useState('Myanmar');
            const [length, setLength] = useState('Short Story (1-2 min)');
            const [style, setStyle] = useState('Fantasy');
            const [promptStyle, setPromptStyle] = useState('Cinematic Realism');
            const [storyData, setStoryData] = useState(null);

            const generateStory = async () => {
                if (!topic || !apiKey) return alert("ကျေးဇူးပြု၍ API Key နှင့် Topic ကို အရင်ဖြည့်ပါ!");
                setLoading(true); setStoryData(null); setAudioUrl(null);

                const systemPrompt = `You are a professional story writer. Respond ONLY in JSON:
                {"title": "Title", "tags": ["Genre", "Length"], "storyContent": "The full story text...", "narrationScript": "Narrator script...", "scenes": [{"title": "Scene Name", "type": "Drama", "imagePrompt": "Detailed AI image prompt..."}]}`;

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Write a ${style} story about "${topic}" in ${language}. Length: ${length}. Image prompt style: ${promptStyle}.` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await res.json();
                    const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                    setStoryData(parsed);
                } catch (e) {
                    alert("အမှားအယွင်းရှိနေပါသည်။ API Key မှန်မမှန် ပြန်စစ်ပေးပါ။");
                } finally {
                    setLoading(false);
                }
            };

            const generateNarration = async () => {
                if (!storyData || !apiKey) return;
                setTtsLoading(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Say in a dramatic narrator voice: ${storyData.narrationScript}` }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            }
                        })
                    });
                    const data = await res.json();
                    const audioBase64 = data.candidates[0].content.parts[0].inlineData.data;
                    const binaryString = atob(audioBase64);
                    const pcmData = new Int16Array(binaryString.length / 2);
                    for (let i = 0; i < pcmData.length; i++) {
                        pcmData[i] = binaryString.charCodeAt(i * 2) | (binaryString.charCodeAt(i * 2 + 1) << 8);
                    }
                    const wavBlob = pcmToWav(pcmData, 24000);
                    setAudioUrl(URL.createObjectURL(wavBlob));
                } catch (e) {
                    alert("အသံထုတ်လုပ်ရာတွင် အခက်အခဲရှိနေပါသည်။");
                } finally {
                    setTtsLoading(false);
                }
            };

            return (
                <div className="min-h-screen max-w-5xl mx-auto p-4 md:p-8 space-y-6">
                    <header className="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-white/5 pb-6">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center shadow-lg shadow-teal-500/20">
                                <SparklesIcon />
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white tracking-tight">NEXT GEN AI STUDIO</h1>
                                <p className="text-[10px] text-teal-500 font-bold tracking-[0.2em] uppercase leading-none">Story & Narration Engine</p>
                            </div>
                        </div>
                        <div className="w-full md:w-auto">
                            <input 
                                type="password" 
                                placeholder="Gemini API Key" 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)}
                                className="w-full md:w-64 bg-[#14181f] border border-teal-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-500 text-teal-400 placeholder:text-slate-600 shadow-inner"
                            />
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className="lg:col-span-4 space-y-6">
                            <section className="bg-[#14181f] border border-white/5 rounded-2xl p-5 shadow-xl">
                                <div className="flex items-center gap-2 mb-6 text-teal-400 font-bold text-xs tracking-widest uppercase">
                                    <SettingsIcon /> <span>Studio Settings</span>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] text-slate-500 font-bold uppercase mb-2">Output Language</label>
                                        <select value={language} onChange={e => setLanguage(e.target.value)} className="w-full bg-[#0a0c10] border border-white/10 rounded-xl px-4 py-2.5 text-sm">
                                            <option>Myanmar</option>
                                            <option>English</option>
                                            <option>Bilingual</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-slate-500 font-bold uppercase mb-2">Story Topic</label>
                                        <textarea 
                                            value={topic} 
                                            onChange={e => setTopic(e.target.value)}
                                            placeholder="A mysterious house in the deep jungle..." 
                                            className="w-full bg-[#0a0c10] border border-white/10 rounded-xl px-4 py-2.5 text-sm h-24 resize-none focus:outline-none focus:border-teal-500/50"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-[10px] text-slate-500 font-bold uppercase mb-2">Length</label>
                                            <select value={length} onChange={e => setLength(e.target.value)} className="w-full bg-[#0a0c10] border border-white/10 rounded-xl px-3 py-2 text-xs">
                                                <option>Short (1-2 min)</option>
                                                <option>Long (5-10 min)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-slate-500 font-bold uppercase mb-2">Style</label>
                                            <select value={style} onChange={e => setStyle(e.target.value)} className="w-full bg-[#0a0c10] border border-white/10 rounded-xl px-3 py-2 text-xs">
                                                <option>Fantasy</option>
                                                <option>Horror</option>
                                                <option>Sci-Fi</option>
                                                <option>Drama</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={generateStory} 
                                        disabled={loading}
                                        className="w-full bg-gradient-to-r from-teal-500 to-emerald-600 text-white rounded-xl py-3 text-xs font-bold uppercase tracking-widest shadow-lg shadow-teal-500/20 hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50"
                                    >
                                        {loading ? "Generating..." : "Generate Output"}
                                    </button>
                                </div>
                            </section>
                        </div>

                        <div className="lg:col-span-5 bg-[#14181f] border border-white/5 rounded-3xl p-6 shadow-2xl flex flex-col min-h-[500px]">
                            <div className="flex items-center gap-2 mb-6 text-teal-400 font-bold text-xs tracking-widest uppercase pb-4 border-b border-white/5">
                                <BookIcon /> <span>Story Canvas</span>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-6">
                                {!storyData && !loading && (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-600 space-y-4">
                                        <BookIcon />
                                        <p className="text-xs font-bold uppercase">Configure & Generate</p>
                                    </div>
                                )}
                                {loading && (
                                    <div className="h-full flex flex-col items-center justify-center space-y-4">
                                        <div className="w-10 h-10 border-4 border-teal-500/20 border-t-teal-500 rounded-full animate-spin" />
                                        <p className="text-xs text-teal-500 font-bold animate-pulse">CREATING STORY...</p>
                                    </div>
                                )}
                                {storyData && (
                                    <article className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                                        <h2 className="text-3xl font-black text-white leading-tight mb-4">{storyData.title}</h2>
                                        <div className="text-slate-300 leading-relaxed space-y-4 font-serif italic text-lg whitespace-pre-wrap">
                                            {storyData.storyContent}
                                        </div>
                                    </article>
                                )}
                            </div>
                        </div>

                        <div className="lg:col-span-3 space-y-6">
                            <section className="bg-[#14181f] border border-white/5 rounded-2xl p-5 shadow-xl">
                                <div className="flex items-center gap-2 mb-5 text-teal-400 font-bold text-xs tracking-widest uppercase">
                                    <VolumeIcon /> <span>TTS Engine</span>
                                </div>
                                <button 
                                    onClick={generateNarration} 
                                    disabled={!storyData || ttsLoading}
                                    className="w-full bg-white/5 border border-white/10 text-white rounded-xl py-2.5 text-[10px] font-bold uppercase tracking-wider hover:bg-white/10 transition-all disabled:opacity-30"
                                >
                                    {ttsLoading ? "Generating Audio..." : "Generate Narration"}
                                </button>
                                {audioUrl && (
                                    <div className="mt-4 flex items-center gap-3 bg-[#0a0c10] p-3 rounded-xl border border-white/5">
                                        <button 
                                            onClick={() => isPlaying ? audioRef.current.pause() : audioRef.current.play()}
                                            className="w-10 h-10 rounded-full bg-teal-500 flex items-center justify-center text-white shadow-lg"
                                        >
                                            {isPlaying ? <PauseIcon /> : <PlayIcon />}
                                        </button>
                                        <div className="flex-1">
                                            <div className="h-1 bg-white/10 rounded-full overflow-hidden">
                                                <div className={`h-full bg-teal-500 ${isPlaying ? 'animate-progress' : ''}`} style={{ width: isPlaying ? '100%' : '0%' }} />
                                            </div>
                                        </div>
                                        <audio ref={audioRef} src={audioUrl} onPlay={()=>setIsPlaying(true)} onPause={()=>setIsPlaying(false)} onEnded={()=>setIsPlaying(false)} className="hidden" />
                                    </div>
                                )}
                            </section>

                            <section className="bg-[#14181f] border border-white/5 rounded-2xl p-5 shadow-xl">
                                <div className="flex items-center gap-2 mb-5 text-teal-400 font-bold text-xs tracking-widest uppercase">
                                    <ImageIcon /> <span>Scene Prompts</span>
                                </div>
                                <div className="space-y-4 max-h-[300px] overflow-y-auto pr-2">
                                    {!storyData && <p className="text-[10px] text-slate-600 text-center py-10 uppercase font-bold tracking-widest">No scenes generated</p>}
                                    {storyData?.scenes.map((scene, i) => (
                                        <div key={i} className="bg-[#0a0c10] p-3 rounded-xl border border-white/5 space-y-2 group">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[9px] font-black text-teal-500 uppercase tracking-tighter">Scene {i+1}</span>
                                                <span className="text-[8px] font-bold text-slate-600 bg-white/5 px-1.5 py-0.5 rounded uppercase">{scene.type}</span>
                                            </div>
                                            <h4 className="text-[11px] font-bold text-white uppercase tracking-tight">{scene.title}</h4>
                                            <p className="text-[10px] text-slate-500 italic leading-snug group-hover:text-slate-400 transition-colors">
                                                {scene.imagePrompt}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    </div>

                    <footer className="py-8 border-t border-white/5 text-center space-y-2 opacity-30">
                        <p className="text-[9px] font-bold uppercase tracking-[0.4em]">© 2026 Next Gen AI Studio Mobile</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
